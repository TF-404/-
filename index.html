<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070e18">
  <meta name="description" content="從臺灣二十五個地區中公平抽出一籤。">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>臺灣縣市抽獎</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070e18'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preload" href="./vendor/fonts/noto-sans-tc-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./css/styles.css?v=11">
</head>
<body>
  <div class="stage">
  <header class="topbar">
    <h1>臺灣縣市抽獎</h1>
    <p>二十五個地區，機會均等</p>
  </header>

  <div id="banner" class="banner">
    <span id="banner-text" role="status" aria-live="polite"></span>
    <div id="fx" class="fx" aria-hidden="true"></div>
  </div>

  <main class="layout">
    <section class="map-wrap" aria-label="臺灣地圖">
      <div id="map" class="map">
        <p id="status" class="status">地圖載入中…</p>
      </div>
    </section>

    <aside class="panel">
      <button type="button" id="draw" class="draw" disabled>
        <span class="draw-face is-on" data-face="idle">抽獎</span>
        <span class="draw-face" data-face="spin" aria-hidden="true">抽籤中…</span>
        <span class="draw-face" data-face="again" aria-hidden="true">再抽一次</span>
        <span class="draw-face" data-face="done" aria-hidden="true">已抽完</span>
      </button>

      <div class="controls">
        <label class="switch">
          <input id="norepeat" type="checkbox" role="switch">
          <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          <span class="switch-text">不重複抽</span>
        </label>
        <button type="button" id="reset" class="reset" disabled>重設</button>
      </div>
      <p id="hint" class="hint">每一輪都從全部地區抽出</p>

      <label class="lookup">
        <span>查詢</span>
        <select id="lookup" aria-label="選擇縣市查看活動、景點與住宿">
          <option value="">選擇縣市</option>
          <option>基隆市</option>
          <option>臺北市</option>
          <option>新北市</option>
          <option>桃園市</option>
          <option>新竹市</option>
          <option>新竹縣</option>
          <option>苗栗縣</option>
          <option>臺中市</option>
          <option>彰化縣</option>
          <option>南投縣</option>
          <option>雲林縣</option>
          <option>嘉義市</option>
          <option>嘉義縣</option>
          <option>臺南市</option>
          <option>高雄市</option>
          <option>屏東縣</option>
          <option>宜蘭縣</option>
          <option>花蓮縣</option>
          <option>臺東縣</option>
          <option>澎湖縣</option>
          <option>金門縣</option>
          <option>連江縣</option>
          <option>小琉球</option>
          <option>綠島</option>
          <option>蘭嶼</option>
        </select>
      </label>

      <h2 class="history-title">抽獎紀錄</h2>
      <ol id="history" class="history">
        <li class="empty">尚無抽獎紀錄</li>
      </ol>
      <a id="donate" class="donate" hidden target="_blank" rel="noopener noreferrer">☕ 贊助</a>
      <p class="credit">界線：內政部縣市與鄉鎮，經 taiwan-atlas 整理</p>
    </aside>
  </main>
  </div>

  <section id="events" class="events" hidden>
    <div class="events-head">
      <h2 id="events-title">這週活動</h2>
      <p id="events-range" class="events-range"></p>
    </div>
    <div id="place-tabs" class="events-tabs" role="tablist">
      <button type="button" class="events-tab is-on" data-pane="events">活動</button>
      <button type="button" class="events-tab" data-pane="spots">景點</button>
      <button type="button" class="events-tab" data-pane="stay">住宿與租車</button>
    </div>
    <div id="pane-events">
      <div id="events-tabs" class="events-tabs" role="tablist"></div>
      <div id="events-list"></div>
      <p id="events-empty" class="events-empty" hidden>這週暫無活動資料</p>
      <p id="events-credit" class="events-credit"></p>
    </div>
    <div id="pane-spots" hidden>
      <div id="spots-list" class="event-cards"></div>
      <button type="button" id="spots-more" class="spots-more" hidden>顯示更多</button>
      <p id="spots-empty" class="events-empty" hidden>暫無景點資料</p>
      <p id="spots-credit" class="events-credit"></p>
    </div>
    <div id="pane-stay" hidden>
      <p class="stay-note">依所選縣市搜尋，入住今天、退房明天。這些連結沒有廣告分潤。</p>
      <div id="stay-links" class="stay-grid"></div>
    </div>
  </section>

  <script src="./vendor/d3.min.js"></script>
  <script src="./vendor/topojson-client.min.js"></script>
  <script src="./js/config.js?v=5"></script>
  <script src="./js/app.js?v=11"></script>
</body>
</html>
